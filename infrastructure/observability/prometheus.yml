global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          component: 'otel-metrics-exporter'
      - targets: ['otel-collector:8888']
        labels:
          component: 'otel-self-telemetry'

  - job_name: 'deeplens-app-services'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:8000'
          - 'host.docker.internal:8080'
          - 'host.docker.internal:9092'
        labels:
          environment: 'production'
          app: 'deeplens'
