name: "DeepLens Squad"
description: "Mahabharata-themed agent roster for the DeepLens project"
version: "1.0.0"

context_files:
  - ".squad/team.md"
  - ".squad/decisions.md"
  - ".squad/templates/skills/release-process/SKILL.md"
  - ".github/skills/squad-conventions/SKILL.md"
  - ".github/skills/git-workflow/SKILL.md"
  - ".github/skills/agent-collaboration/SKILL.md"
  - ".github/skills/secret-handling/SKILL.md"

agents:
  - id: "krishna-lead"
    name: "Krishna (Lead)"
    file: ".squad/agents/krishna-lead.md"
    triggers: ["roadmap:update","release_request","incident:high","policy:decision"]
    default: true

  - id: "yudhishthira-sme"
    name: "Yudhishthira (SME)"
    file: ".squad/agents/yudhishthira-sme.md"
    triggers: ["spec:clarify","business-rule:conflict"]

  - id: "bhishma-architect"
    name: "Bhishma (Architect)"
    file: ".squad/agents/bhishma-architect.md"
    triggers: ["api:breaking-change","db:schema-change","perf:regression"]

  - id: "arjuna-investigator"
    name: "Arjuna (Investigator)"
    file: ".squad/agents/arjuna-investigator.md"
    triggers: ["incident:investigate","ci:flaky","alert:prod"]

  - id: "sanjaya-intelligence"
    name: "Sanjaya (Intelligence / Observability)"
    file: ".squad/agents/sanjaya-intelligence.md"
    triggers: ["deploy:validate","otel:missing","alert:infra"]

  - id: "naga-sql-data"
    name: "Naga (SQL / Data)"
    file: ".squad/agents/naga-sql-data.md"
    triggers: ["db:migration","data:incident","schema:drift"]

  - id: "nakula-debugger"
    name: "Nakula (Debugger)"
    file: ".squad/agents/nakula-debugger.md"
    triggers: ["ci:fail","repro:needed","binary:issue"]

  - id: "vidura-governance"
    name: "Vidura (Governance)"
    file: ".squad/agents/vidura-governance.md"
    triggers: ["policy:violation","secret:leak","audit:request"]

  - id: "vyasa-documentation"
    name: "Vyasa (Documentation)"
    file: ".squad/agents/vyasa-documentation.md"
    triggers: ["api:public-change","release:notes","docs:stale"]

  - id: "abhimanyu-testing"
    name: "Abhimanyu (Testing)"
    file: ".squad/agents/abhimanyu-testing.md"
    triggers: ["pr:opened","ci:fail","test:coverage"]

  - id: "sahadeva-release"
    name: "Sahadeva (Release)"
    file: ".squad/agents/sahadeva-release.md"
    triggers: ["release:requested","tag:created","publish:manual"]

  - id: "ashwatthama-ai-ml"
    name: "Ashwatthama (AI/ML)"
    file: ".squad/agents/ashwatthama-ai-ml.md"
    triggers: ["model:train-complete","data:drift","inference:issue"]
