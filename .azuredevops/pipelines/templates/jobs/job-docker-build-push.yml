# ==============================================================================
# Job Template: Docker Multi-Service Build & Push
# ==============================================================================

parameters:
  - name: agentPool
    type: string
    default: 'ubuntu-latest'
  - name: containerRegistryServiceConnection
    type: string
    default: ''
  - name: imageRepository
    type: string
    default: 'deeplens'
  - name: tag
    type: string
    default: '$(Build.BuildId)'

jobs:
  - job: DockerBuildAndPackage
    displayName: 'Docker Build Microservices'
    pool:
      ${{ if or(eq(parameters.agentPool, 'ubuntu-latest'), eq(parameters.agentPool, 'windows-latest'), eq(parameters.agentPool, 'macOS-latest'), startsWith(parameters.agentPool, 'ubuntu-'), startsWith(parameters.agentPool, 'windows-'), startsWith(parameters.agentPool, 'macos-')) }}:
        vmImage: ${{ parameters.agentPool }}
      ${{ else }}:
        name: ${{ parameters.agentPool }}
    strategy:
      matrix:
        SearchApi:
          contextPath: '.'
          dockerfilePath: 'src/DeepLens.Service/DeepLens.SearchApi/Dockerfile'
          imageName: 'search-api'
        WorkerService:
          contextPath: '.'
          dockerfilePath: 'src/DeepLens.Service/DeepLens.WorkerService/Dockerfile'
          imageName: 'worker-service'
        ReasoningService:
          contextPath: 'src/DeepLens.ReasoningService'
          dockerfilePath: 'src/DeepLens.ReasoningService/Dockerfile'
          imageName: 'reasoning-service'
        WhatsAppProcessor:
          contextPath: 'src/whatsapp-processor'
          dockerfilePath: 'src/whatsapp-processor/Dockerfile'
          imageName: 'whatsapp-processor'
    steps:
      - checkout: self
      - script: |
          echo "=== Building Docker Image: $(imageName) ==="
          docker build \
            -t ${{ parameters.imageRepository }}/$(imageName):${{ parameters.tag }} \
            -t ${{ parameters.imageRepository }}/$(imageName):latest \
            -f $(dockerfilePath) \
            $(contextPath)
          echo "Docker image ${{ parameters.imageRepository }}/$(imageName):${{ parameters.tag }} built successfully."
        displayName: 'Docker Build $(imageName)'

      - ${{ if and(ne(parameters.containerRegistryServiceConnection, ''), ne(parameters.containerRegistryServiceConnection, 'none')) }}:
        - task: Docker@2
          displayName: 'Push $(imageName) to Container Registry'
          inputs:
            containerRegistry: ${{ parameters.containerRegistryServiceConnection }}
            repository: '${{ parameters.imageRepository }}/$(imageName)'
            command: 'push'
            tags: |
              ${{ parameters.tag }}
              latest
