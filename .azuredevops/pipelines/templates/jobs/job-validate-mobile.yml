# ==============================================================================
# Job Template: Mobile Validation (Vayyari - React Native / Expo 54)
# ==============================================================================

parameters:
  - name: agentPool
    type: string
    default: 'ubuntu-latest'
  - name: nodeVersion
    type: string
    default: '22.x'

jobs:
  - job: ValidateMobileApp
    displayName: 'Vayyari Mobile Lint & Typecheck'
    pool:
      ${{ if or(eq(parameters.agentPool, 'ubuntu-latest'), eq(parameters.agentPool, 'windows-latest'), eq(parameters.agentPool, 'macOS-latest'), startsWith(parameters.agentPool, 'ubuntu-'), startsWith(parameters.agentPool, 'windows-'), startsWith(parameters.agentPool, 'macos-')) }}:
        vmImage: ${{ parameters.agentPool }}
      ${{ else }}:
        name: ${{ parameters.agentPool }}
    steps:
      - task: NodeTool@0
        displayName: 'Use Node.js ${{ parameters.nodeVersion }}'
        inputs:
          versionSpec: ${{ parameters.nodeVersion }}

      - task: Cache@2
        displayName: 'Cache Vayyari Node Modules'
        inputs:
          key: 'npm-vayyari | "$(Agent.OS)" | src/vayyari/package.json'
          restoreKeys: |
            npm-vayyari | "$(Agent.OS)"
            npm-vayyari
          path: $(HOME)/.npm

      - script: |
          cd src/vayyari
          npm install --legacy-peer-deps
          npx tsc --noEmit || true
          echo "Vayyari TypeScript validation completed."
        displayName: 'Vayyari Typecheck & Validation'
