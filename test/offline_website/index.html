<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share link required</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f0f0; color: #333;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 12px 32px rgba(0, 0, 0, .08);
      max-width: 30rem; width: 100%; padding: 2.75rem 2.25rem; text-align: center;
    }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 1.5rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: #f0f0f0;
    }
    .icon svg { width: 28px; height: 28px; }
    h1 { font-size: 1.5rem; line-height: 1.3; margin-bottom: .75rem; color: #1a1a1a; }
    p { color: #666; font-size: 1.0625rem; line-height: 1.6; }
    p.muted { color: #999; font-size: .9375rem; margin-top: .75rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>This preview is private</h1>
    <p>You need a share link to view this app preview.</p>
    <p class="muted">Ask the app&rsquo;s owner to send you a share link or published app link.</p>
  </div>
</body>
</html>
