# =============================================================================
# DeepLens LiteLLM Gateway Configuration
# =============================================================================
# Architecture: Multi-Gemini API Key Load Balancing with Local Ollama Fallback
# Unified Endpoint: http://litellm:4000/v1
# Virtual Model Aliases: deeplens-llm, deeplens-fast

model_list:
  # ---------------------------------------------------------------------------
  # Primary Model Group: deeplens-llm (Google Gemini 2.5 Flash Pool)
  # Load balanced across multiple Gemini API keys using least-busy routing
  # ---------------------------------------------------------------------------
  - model_name: deeplens-llm
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_1
      rpm: 15
      tpm: 1000000

  - model_name: deeplens-llm
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_2
      rpm: 15
      tpm: 1000000

  - model_name: deeplens-llm
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_3
      rpm: 15
      tpm: 1000000

  # ---------------------------------------------------------------------------
  # Fallback Tier 1: Local Ollama Phi-4 Mini (GPU VRAM Resident)
  # ---------------------------------------------------------------------------
  - model_name: phi4-mini:latest
    litellm_params:
      model: ollama/phi4-mini:latest
      api_base: http://ollama-gpu:11434

  # ---------------------------------------------------------------------------
  # Fallback Tier 2: Local Ollama Phi-3 (GPU Secondary)
  # ---------------------------------------------------------------------------
  - model_name: phi3:latest
    litellm_params:
      model: ollama/phi3:latest
      api_base: http://ollama-gpu:11434

# -----------------------------------------------------------------------------
# Router Settings: Routing Strategy, Aliases & High Availability
# -----------------------------------------------------------------------------
router_settings:
  routing_strategy: least-busy
  model_group_alias:
    "deeplens-fast": "deeplens-llm"
    "gemini-2.5-flash": "deeplens-llm"
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_url: os.environ/REDIS_URL
  num_retries: 1
  timeout: 120
  retry_after: 5
  allowed_fails: 1
  cooldown_time: 30

# -----------------------------------------------------------------------------
# LiteLLM Core Settings: Fallback Mapping & Request Policies
# -----------------------------------------------------------------------------
litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 1
  request_timeout: 120
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
  fallbacks:
    - deeplens-llm:
        - phi4-mini:latest
        - phi3:latest
    - deeplens-fast:
        - phi4-mini:latest
        - phi3:latest
    - gemini-2.5-flash:
        - phi4-mini:latest
        - phi3:latest

# -----------------------------------------------------------------------------
# General Settings: Proxy Security
# -----------------------------------------------------------------------------
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
