# =============================================================================
# DeepLens LiteLLM Gateway Configuration
# =============================================================================
# Architecture: Dynamic UI & Database-Managed Model Pool with Redis Caching & Router State
# Unified Endpoint: http://litellm:4000/v1
# All models, API keys, and endpoints are managed dynamically via the Admin UI
# and persisted to PostgreSQL (LiteLLM_ProxyModelTable).

model_list:
  # ---------------------------------------------------------------------------
  # Local Ollama GPU Tier 1: Phi-4 Mini (3.8B Q4_K_M Resident in VRAM)
  # ---------------------------------------------------------------------------
  - model_name: phi4-mini:latest
    litellm_params:
      model: ollama/phi4-mini:latest
      api_base: http://ollama-gpu:11434

  # ---------------------------------------------------------------------------
  # Local Ollama GPU Tier 2: Qwen2.5 0.5B (Ultra-Fast Lightweight Model)
  # ---------------------------------------------------------------------------
  - model_name: qwen2.5:0.5b
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: http://ollama-gpu:11434

# -----------------------------------------------------------------------------
# Router Settings: Routing Strategy & High Availability
# -----------------------------------------------------------------------------
router_settings:
  routing_strategy: least-busy
  model_group_alias:
    "deeplens-fast": "deeplens-llm"
    "gemini-2.5-flash": "deeplens-llm"
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_url: os.environ/REDIS_URL
  num_retries: 1
  timeout: 120
  retry_after: 5
  allowed_fails: 1
  cooldown_time: 30

# -----------------------------------------------------------------------------
# LiteLLM Core Settings: Fallback Mapping & Request Policies
# -----------------------------------------------------------------------------
litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 1
  request_timeout: 120
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
  fallbacks:
    - deeplens-llm:
        - phi4-mini:latest
        - qwen2.5:0.5b
    - deeplens-fast:
        - phi4-mini:latest
        - qwen2.5:0.5b
    - gemini-2.5-flash:
        - phi4-mini:latest
        - qwen2.5:0.5b

# -----------------------------------------------------------------------------
# General Settings: Proxy Security & DB Persistence
# -----------------------------------------------------------------------------
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  database_url: os.environ/DATABASE_URL
