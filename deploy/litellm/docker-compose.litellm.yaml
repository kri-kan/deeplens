services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: deeplens-litellm
    restart: always
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - NUM_WORKERS=4
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1:-}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-deeplens-master-key}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://ollama-gpu:11434}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@192.168.0.170:5432/litellm}
      - STORE_MODEL_IN_DB=True
      - UI_USERNAME=${LITELLM_UI_USERNAME:-admin}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD:-sk-deeplens-master-key}
      - REDIS_HOST=${REDIS_HOST:-192.168.0.170}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_URL=${REDIS_URL:-redis://192.168.0.170:6379/0}
      - LITELLM_LOG=INFO
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      deeplens-network:
        aliases:
          - litellm
          - deeplens-litellm

networks:
  deeplens-network:
    external: true
