services:
  openwhispr:
    build:
      context: .
      dockerfile: Dockerfile.openwhispr
    container_name: openwhispr_v2t
    ports:
      - "8090:8090"
    environment:
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=auto
      - WHISPER_COMPUTE_TYPE=int8
      - MODEL_CACHE_DIR=/models/openwhispr
    volumes:
      - ./models/openwhispr:/models/openwhispr
    devices:
      - "/dev/dri:/dev/dri"
    # Enable GPU capability if NVIDIA Container Toolkit is installed on host
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  handy:
    build:
      context: .
      dockerfile: Dockerfile.handy
    container_name: handy_v2t
    ports:
      - "8091:8091"
    environment:
      - HANDY_MODEL=openai/whisper-small
      - MODEL_CACHE_DIR=/models/handy
    volumes:
      - ./models/handy:/models/handy
    devices:
      - "/dev/dri:/dev/dri"
    restart: unless-stopped

  whisper-cpp:
    build:
      context: .
      dockerfile: Dockerfile.whispercpp
    container_name: whispercpp_v2t
    ports:
      - "8092:8092"
    environment:
      - WHISPER_MODEL=small
      - MODEL_CACHE_DIR=/models/whispercpp
    volumes:
      - ./models/whispercpp:/models/whispercpp
    devices:
      - "/dev/dri:/dev/dri"
    restart: unless-stopped

volumes:
  openwhispr_models:
  handy_models:
  whispercpp_models:
