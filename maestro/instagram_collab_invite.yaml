# ==============================================================================
# Step 9: Confirm Done / Checkmark in Tag People screen (Once for all accounts)
# ==============================================================================
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      visible:
        id: "com.instagram.android:id/action_bar_button_done"
    commands:
      - tapOn:
          id: "com.instagram.android:id/action_bar_button_done"
- runFlow:
