      - evalScript: ${output.save_tapped = 'true'}
- runFlow:
    when:
      true: ${output.save_tapped == 'false'}
      visible: "Save"
    commands:
      - tapOn: "Save"
      - evalScript: ${output.save_tapped = 'true'}

# Final pause to allow network dispatch
- evalScript: |
    var start = new Date().getTime();
    while (new Date().getTime() < start + 3000);
