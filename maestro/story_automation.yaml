appId: com.anonymous.vayyari
---
# Start the app. It might open the Expo Dev Launcher.
- stopApp:
    appId: com.anonymous.vayyari
- launchApp:
    appId: com.anonymous.vayyari

# Allow app splash screen / initial launcher transition to settle
- evalScript: |
    var start = new Date().getTime();
    while (new Date().getTime() < start + 3000);

# Handle Expo Developer Launcher if it appears (check both URL pattern and Recently Opened card)
- runFlow:
    when:
      visible: "http://10.0.2.2:8081"
    commands:
      - tapOn: "http://10.0.2.2:8081"
      - evalScript: |
          var start = new Date().getTime();
          while (new Date().getTime() < start + 8000);
- runFlow:
    when:
      visible: "RECENTLY OPENED"
    commands:
      - tapOn:
          text: "vayyari"
          below: "RECENTLY OPENED"
      - evalScript: |
          var start = new Date().getTime();
          while (new Date().getTime() < start + 8000);

# Navigate directly to the story queue screen and set the profile
- openLink: "vayyari://utilities/instagram/story-queue?profileUsername=${PROFILE_NAME}"

# Wait dynamically for either the queue to load or the login fallback
- evalScript: ${output.screen_loaded = 'false'}
- evalScript: ${output.wait_counter = 0}
- repeat:
    while:
      true: ${output.screen_loaded == 'false' && output.wait_counter < 60}
    commands:
      # If the app got stuck on Expo Dev Launcher or returned to it, tap dev server / recently opened card and reload deep link
      - runFlow:
          when:
            visible: "http://10.0.2.2:8081"
          commands:
            - tapOn: "http://10.0.2.2:8081"
            - evalScript: |
                var start = new Date().getTime();
                while (new Date().getTime() < start + 8000);
            - openLink: "vayyari://utilities/instagram/story-queue?profileUsername=${PROFILE_NAME}"
      - runFlow:
          when:
            visible: "RECENTLY OPENED"
          commands:
            - tapOn:
                text: "vayyari"
                below: "RECENTLY OPENED"
            - evalScript: |
                var start = new Date().getTime();
                while (new Date().getTime() < start + 8000);
            - openLink: "vayyari://utilities/instagram/story-queue?profileUsername=${PROFILE_NAME}"
      - runFlow:
          when:
            visible: "Sign In"
          commands:
            - evalScript: ${output.screen_loaded = 'login'}
      - runFlow:
          when:
            visible:
              id: "share-queue-item-0"
          commands:
            - evalScript: ${output.screen_loaded = 'queue'}
      - runFlow:
          when:
            visible: "Queue is empty."
          commands:
            - evalScript: ${output.screen_loaded = 'empty'}
      - runFlow:
          when:
            visible: "System Dashboard"
          commands:
            - openLink: "vayyari://utilities/instagram/story-queue?profileUsername=${PROFILE_NAME}"
      - runFlow:
          when:
            true: ${output.screen_loaded == 'false'}
          commands:
            - evalScript: |
                var start = new Date().getTime();
                while (new Date().getTime() < start + 1000);
            - evalScript: ${output.wait_counter = output.wait_counter + 1}

# Handle genuinely empty queue without attempting to share items
- runFlow:
    when:
      true: ${output.screen_loaded == 'empty'}
    commands:
      # Tapping this intentional signal ID halts the flow immediately with a distinct error
      # so the bash runner knows the queue is genuinely empty and not a loading timeout or crash.
      - tapOn:
          id: "SIGNAL_QUEUE_IS_EMPTY"

# If screen failed to load after full timeout, abort cleanly so retry logic can trigger
- runFlow:
    when:
      true: ${output.screen_loaded == 'false'}
    commands:
      - tapOn:
          id: "ERROR_APP_LOADING_TIMEOUT"

# Handle potential stale session fallback to login
- runFlow:
    when:
      true: ${output.screen_loaded == 'login'}
    commands:
      - tapOn: "Sign In"
      - extendedWaitUntil:
          visible: "System Dashboard"
          timeout: 10000
      - openLink: "vayyari://utilities/instagram/story-queue?profileUsername=${PROFILE_NAME}"
      - extendedWaitUntil:
          visible:
            id: "share-queue-item-0"
          timeout: 15000

# Stop Instagram background process to force a cold start when opening the link
- stopApp:
    appId: com.instagram.android

# Small pause to ensure process termination completes
- evalScript: |
    var start = new Date().getTime();
    while (new Date().getTime() < start + 500);

# Find the next item in the queue and click its Share button
- tapOn:
    id: "share-queue-item-0"

# Wait dynamically for either the Reel or Post share button to load
- evalScript: ${output.insta_loaded = 'false'}
- evalScript: ${output.insta_wait = 0}
- repeat:
    while:
      true: ${output.insta_loaded == 'false' && output.insta_wait < 20}
    commands:
      - runFlow:
          when:
            visible:
              id: "com.instagram.android:id/direct_share_button"
          commands:
            - evalScript: ${output.insta_loaded = 'reel'}
      - runFlow:
          when:
            visible:
              id: "com.instagram.android:id/row_feed_button_share"
          commands:
            - evalScript: ${output.insta_loaded = 'post'}
      - runFlow:
          when:
            true: ${output.insta_loaded == 'false'}
          commands:
            - evalScript: |
                var start = new Date().getTime();
                while (new Date().getTime() < start + 500);
            - evalScript: ${output.insta_wait = output.insta_wait + 1}

# Add 1 second gap after share button appears before interacting
- evalScript: |
    var start = new Date().getTime();
    while (new Date().getTime() < start + 1000);

# REEL path: tap the floating right-side direct share button (paper plane)
- runFlow:
    when:
      true: ${output.insta_loaded == 'reel'}
    commands:
      - tapOn:
          id: "com.instagram.android:id/direct_share_button"
          waitToSettleTimeoutMs: 0
      # Wait for share sheet animation to complete; prevents the post fallback
      # below from double-firing on the now-hidden reel share button.
      - evalScript: |
          var start = new Date().getTime();
          while (new Date().getTime() < start + 1500);

# POST path: tap the bottom action bar Share icon if the reel button wasn't present.
# Resource ID confirmed from UI hierarchy dump: row_feed_button_share (accessibilityText="Send post")
- runFlow:
    when:
      true: ${output.insta_loaded == 'post'}
    commands:
      - tapOn:
          id: "com.instagram.android:id/row_feed_button_share"
          waitToSettleTimeoutMs: 0
      # Wait for share sheet animation to complete
      - evalScript: |
          var start = new Date().getTime();
          while (new Date().getTime() < start + 1500);



# Wait explicitly for the button to appear (and scroll right if it's hidden)
- scrollUntilVisible:
    element:
      text: "Add to story"
    direction: RIGHT
    timeout: 10000
    centerElement: true
- evalScript: |
    var start = new Date().getTime();
    while (new Date().getTime() < start + 1500);

# Tap Add to story text label directly with zero settle delay
- tapOn:
    text: "Add to story"
    waitToSettleTimeoutMs: 0

# Dynamic wait loop: handles instant transitions, slow loading labels, and retry clicks
- evalScript: ${output.story_added = 'false'}
- evalScript: ${output.story_wait = 0}
- repeat:
    while:
      true: ${output.story_added == 'false' && output.story_wait < 30}
    commands:
      # Check 1: Story editor loaded ("Close Friends" or "Your story" visible)
      - runFlow:
          when:
            visible: "Close Friends"
          commands:
            - evalScript: ${output.story_added = 'editor'}
      - runFlow:
          when:
            visible: "Your stor.*"
          commands:
            - evalScript: ${output.story_added = 'editor'}
      # Check 2: "Add to story" button disappeared from view
      - runFlow:
          when:
            notVisible:
              text: "Add to story"
          commands:
            - evalScript: ${output.story_added = 'disappeared'}
      # Check 3: Loading label / spinner on screen (keep waiting while loading)
      - runFlow:
          when:
            visible:
              text: "Loading.*"
          commands:
            - evalScript: |
                var start = new Date().getTime();
                while (new Date().getTime() < start + 1000);
      # Check 4: Smart retry tap if "Add to story" is STILL visible after 3s and no loading indicator/editor has opened
      - runFlow:
          when:
            true: ${output.story_added == 'false' && output.story_wait > 3 && output.story_wait % 4 == 0}
          commands:
            - runFlow:
                when:
                  visible:
                    text: "Add to story"
                commands:
                  - tapOn:
                      text: "Add to story"
                      waitToSettleTimeoutMs: 0
      - runFlow:
          when:
            true: ${output.story_added == 'false'}
          commands:
            - evalScript: |
                var start = new Date().getTime();
                while (new Date().getTime() < start + 1000);
            - evalScript: ${output.story_wait = output.story_wait + 1}

# Wait for Story editor to finish rendering ("Close Friends" or "Your story" bottom bar)
- runFlow:
    when:
      notVisible: "Close Friends"
    commands:
      - extendedWaitUntil:
          visible: "Your stor.*"
          timeout: 90000

# Enforce a 1 second gap after elements appear before interacting
- evalScript: |
    var start = new Date().getTime();
    while (new Date().getTime() < start + 1000);

# Tap "Your story" to post directly, bypassing the multi-step share sheet.
# For accounts linked to Facebook (like vayyari_fashions), the button says "Your stories".
- tapOn: 
    text: "Your stor.*"

# Wait a brief moment for Done button to appear (if applicable)
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

# Enforce a 1 second gap after posting
- evalScript: |
    var start = new Date().getTime();
    while (new Date().getTime() < start + 1000);

# ── Return to Vayyari ─────────────────────────────────────────────────────────
# Use the deep link (not launchApp) to guarantee we land on the queue page
# regardless of the app's navigation stack state.
- openLink: "vayyari://utilities/instagram/story-queue?profileUsername=${PROFILE_NAME}"

# Wait for the mark-shared button to appear
- extendedWaitUntil:
    visible:
      id: "mark-shared-queue-item-0"
    timeout: 10000

# Human-like delay before returning to the next item
- evalScript: |
    var start = new Date().getTime();
    while (new Date().getTime() < start + 1000);

# Mark as shared in Vayyari
- tapOn:
    id: "mark-shared-queue-item-0"
