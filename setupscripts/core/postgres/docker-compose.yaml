services:
  postgres:
    image: postgres:18
    container_name: krikanpg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${INFRA_ADMIN_USER}
      POSTGRES_PASSWORD: ${INFRA_ADMIN_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/18/docker
      - ${POSTGRES_BACKUP_PATH}:/backups
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${INFRA_ADMIN_USER}"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - deeplens-network

  # Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${INFRA_ADMIN_PASSWORD:-Krikank1$}
      - DB_NAME=*
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - LISTEN_PORT=6432
      - LISTEN_ADDR=0.0.0.0
      - ADMIN_USERS=postgres,${INFRA_ADMIN_USER:-krikan}
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deeplens-network

  # Database Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${INFRA_ADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${INFRA_ADMIN_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ${PGADMIN_DATA_PATH}:/var/lib/pgadmin
    networks:
      - deeplens-network
    depends_on:
      - postgres

networks:
  deeplens-network:
    external: true
