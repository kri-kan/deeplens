services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./rules:/etc/prometheus/rules
      # - ${PROMETHEUS_DATA_PATH}:/prometheus  # disabled for local run to avoid mmap permission issues; use named volume or set correct permissions if persistence is required
    # Ensure prometheus can resolve the host machine when targets use host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/tmp/prometheus'  # use tmp path inside container to avoid host volume/mount permission issues (ephemeral)
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - deeplens-network

networks:
  deeplens-network:
    external: true
