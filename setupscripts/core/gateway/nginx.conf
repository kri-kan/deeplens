worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # DNS Resolver for Docker internal network
    resolver 127.0.0.11 valid=30s;

    # ── DEFAULT / LOCALHOST (DeepLens Dashboard Landing Page) ──
    server {
        listen       80 default_server;
        server_name  localhost "";

        # DeepLens Branding Landing Page
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        # Grafana
        location /grafana/ {
            set $grafana_upstream http://grafana:3000/;
            proxy_pass $grafana_upstream;
            proxy_set_header Host $host;
        }

        # MinIO Console
        location /minio/ {
            set $minio_upstream http://minio:9001/;
            proxy_pass $minio_upstream;
            proxy_set_header Host $host;
        }

        # Kafka UI
        location /kafka-ui/ {
            set $kafka_ui_upstream http://kafka-ui:8080/;
            proxy_pass $kafka_ui_upstream;
            proxy_set_header Host $host;
        }

        # InfluxDB
        location /influx/ {
            set $influx_upstream http://influxdb:8086/;
            proxy_pass $influx_upstream;
            proxy_set_header Host $host;
        }

        # Qdrant Dashboard
        location /qdrant/ {
            set $qdrant_upstream http://qdrant:6333/;
            proxy_pass $qdrant_upstream;
            proxy_set_header Host $host;
        }

        # pgAdmin Web UI
        location /pgadmin/ {
            set $pgadmin_upstream http://pgadmin:80/;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_pass $pgadmin_upstream;
            proxy_redirect off;
        }

        # Jaeger UI
        location /jaeger/ {
            set $jaeger_upstream http://jaeger:16686/;
            proxy_pass $jaeger_upstream;
            proxy_set_header Host $host;
        }

        # Prometheus UI
        location /prometheus/ {
            set $prometheus_upstream http://prometheus:9090/;
            proxy_pass $prometheus_upstream;
            proxy_set_header Host $host;
        }

        # Open WebUI (Ollama)
        location /chat/ {
            set $open_webui_upstream http://open-webui:8080/;
            proxy_pass $open_webui_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vayyari OTA Updates (MinIO bucket proxy)
        location /vayyari-updates/ {
            proxy_pass http://minio:9000/vayyari-updates/;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check for the gateway itself
        location /health {
            return 200 'OK';
        }
    }

    # ── VAYYARI STORE FRONTEND (Port 8082: Store Website) ──
    server {
        listen 80;
        server_name vayyarifashions.com www.vayyarifashions.com store.vayyarifashions.com;

        location / {
            set $store_web_upstream http://172.17.0.1:8082;
            proxy_pass $store_web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── VAYYARI ADMIN APP (Port 8081: Admin Expo / Web App) ──
    server {
        listen 80;
        server_name admin.vayyarifashions.com;

        location / {
            set $admin_web_upstream http://172.17.0.1:8081;
            proxy_pass $admin_web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── VAYYARI STORE API (Port 5200: Curation, PDP Live, Cart, Wishlist) ──
    server {
        listen 80;
        server_name store-api.vayyarifashions.com storeapi.vayyarifashions.com;

        location / {
            set $store_api_upstream http://deeplens-store-api:5200;
            proxy_pass $store_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── DEEPLENS SEARCH & CATALOG & ADMIN API (Port 5000: Products, Search, Catalog, Admin) ──
    server {
        listen 80;
        server_name api.vayyarifashions.com adminapi.vayyarifashions.com;

        location / {
            set $search_api_upstream http://deeplens-api:5000;
            proxy_pass $search_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── IDENTITY & AUTH API (Port 5000: Authentication & JWT Tokens) ──
    server {
        listen 80;
        server_name auth.vayyarifashions.com;

        location / {
            set $identity_api_upstream http://deeplens-api:5000;
            proxy_pass $identity_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── MEDIA S3 ASSETS (Port 9000: MinIO Store Assets & Thumbnails) ──
    server {
        listen 80;
        server_name media.vayyarifashions.com;

        location / {
            set $minio_s3_upstream http://minio:9000;
            proxy_pass $minio_s3_upstream;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── WHATSAPP PROCESSOR (Port 3000: Ingestion & Webhooks) ──
    server {
        listen 80;
        server_name wa.vayyarifashions.com;

        location / {
            set $whatsapp_upstream http://deeplens-whatsapp-default-vayyari:3000;
            proxy_pass $whatsapp_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
