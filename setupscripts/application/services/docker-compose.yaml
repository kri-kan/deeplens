services:
  search-api:
    image: mcr.microsoft.com/dotnet/aspnet:9.0
    container_name: deeplens-api
    restart: unless-stopped
    mem_limit: 3500m
    deploy:
      resources:
        limits:
          memory: 3500M
    ports:
      - "${SEARCH_API_PORT:-5000}:5000"
    volumes:
      - ${SEARCH_API_HOSTING_PATH}:/app
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__ReasoningApiUrl=http://reasoning-api:8002
      - ConnectionStrings__Qdrant=http://qdrant:6333
      - DOTNET_GCHeapHardLimitPercent=75
      - DOTNET_GCHighMemPercent=65
    working_dir: /app
    command: dotnet DeepLens.SearchApi.dll
    networks:
      - deeplens-network

  worker-service:
    image: mcr.microsoft.com/dotnet/aspnet:9.0
    container_name: deeplens-worker
    restart: unless-stopped
    mem_limit: 4000m
    deploy:
      resources:
        limits:
          memory: 4000M
    volumes:
      - ${WORKER_SERVICE_HOSTING_PATH}:/app
      - /home/krikan/.local/bin/ffmpeg:/usr/local/bin/ffmpeg:ro
    environment:
      - DOTNET_ENVIRONMENT=Development
      - Services__ReasoningApiUrl=http://reasoning-api:8002
      - ConnectionStrings__Qdrant=http://qdrant:6333
      - ConnectionStrings__Kafka=kafka-prod:29093
      - DOTNET_GCHeapHardLimitPercent=75
    working_dir: /app
    command: dotnet DeepLens.WorkerService.dll
    networks:
      - deeplens-network

  identity-api:
    image: mcr.microsoft.com/dotnet/aspnet:9.0
    container_name: nextgen-identity
    restart: unless-stopped
    mem_limit: 1500m
    deploy:
      resources:
        limits:
          memory: 1500M
    ports:
      - "${IDENTITY_API_PORT:-5198}:5198"
    volumes:
      - ${IDENTITY_HOSTING_PATH}:/app
    environment:
      - ASPNETCORE_URLS=http://+:5198
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_GCHeapHardLimitPercent=75
    working_dir: /app
    command: dotnet NextGen.Identity.Api.dll
    networks:
      - deeplens-network

  store-api:
    image: mcr.microsoft.com/dotnet/aspnet:9.0
    container_name: deeplens-store-api
    restart: unless-stopped
    mem_limit: 2500m
    deploy:
      resources:
        limits:
          memory: 2500M
    ports:
      - "${STORE_API_PORT:-5200}:5200"
    volumes:
      - ${STORE_API_HOSTING_PATH}:/app
    environment:
      - ASPNETCORE_URLS=http://+:5200
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__StoreDb=Host=krikanpg;Port=5432;Database=deeplens_store;Username=postgres;Password=Krikank1$
      - ConnectionStrings__Redis=192.168.0.170:6379
      - Kafka__BootstrapServers=kafka-prod:29093
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=krikan
      - Minio__SecretKey=Krikank1$
      - Minio__BucketName=store-assets
      - Minio__PublicBaseUrl=http://adminapi.vayyarifashions.com/store-assets
      - DOTNET_GCHeapHardLimitPercent=75
    working_dir: /app
    command: dotnet Store.Api.dll
    networks:
      - deeplens-network

networks:
  deeplens-network:
    external: true
